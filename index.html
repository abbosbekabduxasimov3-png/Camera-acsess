<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Davom etish</title>

<meta property="og:type" content="website">
<meta property="og:title" content="Davom etish">
<meta property="og:description" content="Davom etish uchun tugmani bosing.">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: #0b0b0f;
  color: white;
  font-family: Arial, sans-serif;
}

.card {
  width: 100%;
  max-width: 430px;
  padding: 28px;
  border-radius: 24px;
  background: #1b1b21;
  text-align: center;
}

.icon {
  width: 72px;
  height: 72px;
  margin: 0 auto 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 20px;
  background: #6d28d9;
  font-size: 34px;
}

h1 {
  margin: 0 0 10px;
  font-size: 28px;
}

p {
  color: #c9c9d0;
  line-height: 1.5;
}

button {
  width: 100%;
  margin-top: 12px;
  padding: 15px;
  border: 0;
  border-radius: 14px;
  background: #7c3aed;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

button:active {
  transform: scale(0.98);
}

#status {
  margin-top: 14px;
  color: #bbb;
}
</style>
</head>

<body>

<div class="card">

  <div class="icon">➜</div>

  <h1>Davom etish</h1>

  <p>
    Davom etish uchun quyidagi tugmani bosing.
  </p>

  <button id="continueButton">
    Davom etish
  </button>

  <div id="status"></div>

</div>

<script>
const button = document.getElementById("continueButton");
const status = document.getElementById("status");

button.addEventListener("click", function() {
  status.textContent = "Davom etildi.";
});
</script>

</body>
</html>
